name: Release Linux packages
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['Cargo.toml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Install test backends
        run: sudo apt-get update && sudo apt-get install -y curl openssl iproute2 iputils-ping dnsutils
      - run: cargo fmt --check && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: python3 tests/terminal_smoke.py target/release/nexus
      - run: python3 tests/responsiveness.py target/release/nexus
      - run: python3 tests/graphics_pty.py target/release/nexus
      - run: python3 scripts/package.py
      - name: Create tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            release_tag="$RELEASE_REF_NAME"
          else
            release_tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; its assets remain unchanged."
          else
            gh release create "$release_tag" dist/* --target "$RELEASE_SHA" --generate-notes --title "NEXUS $release_tag"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release
          path: dist/*
