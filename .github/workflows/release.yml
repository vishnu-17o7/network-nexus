name: Release Linux packages
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['Cargo.toml', '.github/workflows/release.yml', 'scripts/package.py']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Native builds on the oldest supported userspace, independent of host libc.
    container: ubuntu:22.04
    steps:
      - name: Install build and diagnostic dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config git curl ca-certificates python3 python3-tomli openssl iproute2 iputils-ping dnsutils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: python3 tests/terminal_smoke.py target/release/nexus
      - run: python3 tests/responsiveness.py target/release/nexus
      - run: python3 tests/graphics_pty.py target/release/nexus
      - run: python3 scripts/package.py --max-glibc 2.35
      - name: Verify native installation on Ubuntu 22.04
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          apt-get install -y ./dist/nexus-net_*_${{ matrix.arch }}.deb
          nexus --version
          nexus --doctor
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-${{ matrix.arch }}
          path: dist/nexus*
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: ubuntu:24.04
            arch: amd64
            label: ubuntu-24-amd64
          - runner: ubuntu-24.04-arm
            image: debian:bookworm-slim
            arch: arm64
            label: debian-12-arm64
          - runner: ubuntu-24.04-arm
            image: debian:trixie-slim
            arch: arm64
            label: debian-13-arm64
    name: Verify ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install runtime and test tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates python3 curl openssl iproute2 iputils-ping dnsutils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexus-release-${{ matrix.arch }}
          path: dist
      - name: Install the release artifact
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          apt-get install -y ./dist/nexus-net_*_${{ matrix.arch }}.deb
          nexus --version
          nexus --doctor
      - run: python3 tests/terminal_smoke.py /usr/bin/nexus
      - run: python3 tests/responsiveness.py /usr/bin/nexus
      - run: python3 tests/graphics_pty.py /usr/bin/nexus
  publish:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums for both architectures
        working-directory: dist
        run: sha256sum nexus* > SHA256SUMS
      - name: Create tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            release_tag="$RELEASE_REF_NAME"
          else
            release_tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; its assets remain unchanged."
          else
            gh release create "$release_tag" dist/* --target "$RELEASE_SHA" --notes-file docs/RELEASE.md --title "NEXUS $release_tag"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-combined
          path: dist/*
