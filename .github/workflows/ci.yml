name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ubuntu: "22.04"
            arch: amd64
          - runner: ubuntu-24.04
            ubuntu: "24.04"
            arch: amd64
          - runner: ubuntu-24.04-arm
            ubuntu: "22.04"
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install build and diagnostic dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config git curl ca-certificates python3 python3-tomli openssl iproute2 iputils-ping dnsutils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: python3 tests/terminal_smoke.py target/release/nexus
      - run: python3 tests/responsiveness.py target/release/nexus
      - run: python3 tests/graphics_pty.py target/release/nexus
      - run: python3 scripts/package.py
      - name: Install and start the generated Debian package
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          apt-get install -y ./dist/nexus-net_*_${{ matrix.arch }}.deb
          nexus --version
          nexus --doctor
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-${{ matrix.arch }}-ubuntu-${{ matrix.ubuntu }}
          path: dist/*
