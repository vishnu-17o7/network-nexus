name: Prepare local development tools
on:
  push:
    branches: ['feat/workbench-ui-0.5.0']
    paths: ['.github/workflows/development-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y build-essential pkg-config git curl ca-certificates
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Bundle compiler and vendored dependencies
        shell: bash
        run: |
          mkdir -p target/development-tools
          cargo vendor --locked target/vendor > target/development-tools/vendor-config.toml
          tar -czf target/development-tools/vendor.tar.gz -C target vendor
          tar -czf target/development-tools/rust-toolchain.tar.gz -C "$(rustc --print sysroot)" bin lib
          cd target/development-tools
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-development-tools
          path: target/development-tools/
          retention-days: 1
