[package]
name = "nexus-net"
version = "0.4.2"
edition = "2021"
rust-version = "1.88"
description = "A terminal-native Linux and Raspberry Pi network control center"
license = "MIT"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
tiny-skia = "0.11.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
libc = "0.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
zeroize = "1"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
url = "2"

[profile.release]
lto = false
codegen-units = 1
strip = true
